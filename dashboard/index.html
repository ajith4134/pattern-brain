<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pattern Brain — Living Graph (step 2)</title>
<link rel="stylesheet" href="https://esm.sh/reactflow@11/dist/style.css" />
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "htm": "https://esm.sh/htm@3.1.1",
    "reactflow": "https://esm.sh/reactflow@11.11.4?external=react,react-dom"
  }
}
</script>
<style>
  :root { --bg:#0b1020; --panel:#121a30; --panel2:#0f1628; --line:#26314f;
          --txt:#e6ecff; --dim:#8aa0c8; --accent:#5eead4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:16px; }
  header h1 { font-size:16px; margin:0; letter-spacing:.5px; }
  header .sub { color:var(--dim); font-size:12px; }
  button { background:var(--accent); color:#062018; border:0; border-radius:6px;
           padding:8px 16px; font-weight:700; cursor:pointer; font-family:inherit; }
  button:disabled { opacity:.4; cursor:default; }
  .wrap { display:grid; grid-template-columns: 1fr 360px; gap:12px; padding:12px; }
  .col { display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px;
             color:var(--dim); margin:0; padding:10px 14px; border-bottom:1px solid var(--line); }
  .card .body { padding:12px 14px; }
  #graph { height:420px; }
  .belief { border:1px solid var(--line); border-radius:8px; padding:8px 10px;
            margin-bottom:8px; background:var(--panel2); font-size:12px; }
  .belief .top { display:flex; justify-content:space-between; margin-bottom:4px; }
  .belief .type { font-weight:700; }
  .belief .conf { color:var(--accent); }
  .belief .src { color:var(--dim); }
  .belief pre { margin:6px 0 0; white-space:pre-wrap; word-break:break-word;
                color:#bcd; font-size:11px; max-height:90px; overflow:auto; }
  .stream { max-height:360px; overflow:auto; }
  .kv { display:flex; justify-content:space-between; font-size:12px; padding:3px 0;
        border-bottom:1px dotted var(--line); }
  .kv span:first-child { color:var(--dim); }
  .future { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .future .f { border:1px dashed var(--line); border-radius:8px; padding:10px;
               color:var(--dim); font-size:11px; opacity:.7; }
  .future .f b { color:var(--txt); display:block; margin-bottom:3px; }
  .hint { color:var(--dim); font-size:11px; padding:0 14px 12px; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; padding:8px 14px; font-size:11px; color:var(--dim); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .tabs { display:flex; gap:6px; }
  .tab { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
         border-radius:6px; padding:6px 14px; font-weight:700; cursor:pointer; font-size:12px; }
  .tab.active { background:var(--accent); color:#062018; border-color:var(--accent); }
  .adapter-grid { display:grid; grid-template-columns:1fr 360px; gap:12px; padding:12px; }
  .matrix { font-size:10px; max-height:240px; overflow:auto; }
  .matrix table { border-collapse:collapse; width:100%; }
  .matrix th { color:var(--dim); text-align:right; padding:2px 8px; position:sticky; top:0; background:var(--panel); }
  .matrix td { text-align:right; padding:1px 8px; color:#bcd; }
  .pill { display:inline-block; background:var(--panel2); border:1px solid var(--line);
          border-radius:12px; padding:2px 10px; margin:2px; font-size:11px; color:var(--accent); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; padding:12px 14px; }
  .tile { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .tile .big { font-size:30px; font-weight:800; color:var(--accent); }
  .tile .lbl { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; margin-top:4px; }
  .subsys { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; padding:12px 14px; }
  .subsys .s { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px; cursor:pointer; transition:border-color .2s; }
  .subsys .s:hover { border-color:var(--accent); }
  .subsys .s .n { font-weight:700; display:flex; justify-content:space-between; }
  .subsys .s .n b { color:var(--accent); }
  .subsys .s .d { color:var(--dim); font-size:11px; margin-top:5px; }
  .ftable { width:100%; font-size:11px; border-collapse:collapse; }
  .ftable th { text-align:left; color:var(--dim); position:sticky; top:0; background:var(--panel); padding:4px 8px; }
  .ftable td { padding:3px 8px; border-bottom:1px dotted var(--line); }
  .ftable td.num { text-align:right; color:var(--accent); }
  .ftable tr:hover td { background:var(--panel2); }
  .kindtag { font-size:9px; padding:1px 6px; border-radius:8px; background:var(--panel); border:1px solid var(--line); color:var(--dim); }
  .buildrow { display:flex; align-items:center; gap:8px; font-size:12px; padding:3px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React, { useState, useEffect, useCallback, useRef } from "react";
import { createRoot } from "react-dom/client";
import htm from "htm";
import ReactFlow, { Background, Controls, MarkerType } from "reactflow";

const html = htm.bind(React.createElement);

// --- Adapter View (build-tracker step 3) — the ONLY stock-specific tab (Rule 23).
// Candles in -> StockDataAdapter -> generic (T,D) -> the SAME core pathway runs.
function AdapterView() {
  const [data, setData] = React.useState(null);
  const [err, setErr] = React.useState(null);
  const candleRef = React.useRef(null);

  React.useEffect(() => {
    fetch("/api/adapter").then(r => r.json()).then(setData).catch(e => setErr(String(e)));
  }, []);

  React.useEffect(() => {
    if (!data || !candleRef.current || !window.Plotly) return;
    const c = data.candles;
    window.Plotly.react(candleRef.current, [{
      type: "candlestick", x: c.timestamp,
      open: c.open, high: c.high, low: c.low, close: c.close,
      increasing: { line: { color: "#34d399" } }, decreasing: { line: { color: "#f87171" } },
    }], {
      margin: { l: 44, r: 8, t: 6, b: 24 }, height: 380,
      paper_bgcolor: "transparent", plot_bgcolor: "transparent",
      font: { color: "#8aa0c8", size: 10 },
      xaxis: { gridcolor: "#26314f", rangeslider: { visible: false } },
      yaxis: { gridcolor: "#26314f" },
    }, { displayModeBar: false });
  }, [data]);

  if (err) return html`<div class="card"><div class="body"><span class="sub">adapter error: ${err}</span></div></div>`;
  if (!data) return html`<div class="card"><div class="body"><span class="sub">loading adapter demo…</span></div></div>`;

  const decision = (data.trace.hops || []).slice(-1)[0];
  const rows = data.features.slice(0, 12);
  return html`
    <div class="adapter-grid">
      <div class="col">
        <div class="card">
          <h2>Adapter View — stock candles (the ONLY domain-specific visual, Rule 23)</h2>
          <div class="body"><div ref=${candleRef}></div></div>
          <div class="hint">${data.n_candles} synthetic OHLCV candles. This candlestick is the one stock-specific surface; everything to the right is already the generic core.</div>
        </div>
        <div class="card">
          <h2>Generic (T, D) handed to the SAME core — "the data bends to the system" (§0)</h2>
          <div class="body">
            <div style=${{ marginBottom: "8px" }}>
              feature columns (D=${data.feature_shape[1]}, T=${data.feature_shape[0]}):
              ${data.feature_names.map((f,i) => html`<span class="pill" key=${i}>${f}</span>`)}
            </div>
            <div class="matrix">
              <table>
                <thead><tr><th>t</th>${data.feature_names.map((f,i)=>html`<th key=${i}>${f}</th>`)}</tr></thead>
                <tbody>
                  ${rows.map((row,i) => html`<tr key=${i}><td style=${{color:"#8aa0c8"}}>${i}</td>${row.map((v,j)=>html`<td key=${j}>${v.toFixed(4)}</td>`)}</tr>`)}
                </tbody>
              </table>
            </div>
            <div class="hint" style=${{ padding: "8px 0 0" }}>first ${rows.length} of ${data.feature_shape[0]} rows — a finite (T, D) array identical in shape/contract to what the synthetic core uses.</div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card">
          <h2>Same pathway runs on adapted data</h2>
          <div class="body">
            <div class="kv"><span>pathway</span><span>${data.pathway.join(" → ")}</span></div>
            <div class="kv"><span>terminal type</span><span>${decision ? decision.belief.type : "?"}</span></div>
            <div class="kv"><span>action</span><span style=${{color:"#5eead4"}}>${decision ? (decision.belief.payload.action||"?") : "?"}</span></div>
            <div class="kv"><span>confidence</span><span>${decision ? decision.belief.confidence.toFixed(3) : "?"}</span></div>
          </div>
        </div>
        <div class="card">
          <h2>Belief stream on adapted candles</h2>
          <div class="body stream">
            ${(data.trace.hops||[]).map((h,i) => html`
              <div class="belief" key=${i}>
                <div class="top"><span class="type">${h.belief.type}${h.transformed ? " ⇄" : ""}</span>
                  <span class="conf">conf ${h.belief.confidence.toFixed(3)}</span></div>
                <div class="src">#${h.step} · ${h.belief.source}</div>
              </div>`)}
          </div>
        </div>
        <div class="card">
          <h2>Rule 23 / §0 — portability</h2>
          <div class="body"><span class="sub">A future domain plugs in a different adapter and lights up the same core views — only this tab changes. The candlestick is the sole stock-specific element on the whole dashboard.</span></div>
        </div>
      </div>
    </div>`;
}

// Functional-layer colours (Block 18 ordering) — generic, no domain meaning.
const LAYER_COLOR = {
  signal:"#38bdf8", noise:"#a78bfa", pattern:"#f472b6", sequence:"#34d399",
  probability:"#fbbf24", equation:"#fb923c", decision:"#f87171", rl:"#22d3ee",
};
const color = (l) => LAYER_COLOR[l] || "#94a3b8";

function nodeStyle(layer, fired) {
  const c = color(layer);
  return {
    background: fired ? c : "#1b2540",
    color: fired ? "#06121f" : "#cbd5f5",
    border: `2px solid ${c}`,
    borderRadius: 10, padding: "8px 12px", fontSize: 12, fontWeight: 700,
    width: 150, textAlign: "center",
    boxShadow: fired ? `0 0 18px ${c}` : "none",
    transition: "all .35s ease",
  };
}

// --- Connector v1 routed pathway (build-tracker step 4). A router DECIDES the
// path hop-by-hop; this shows the discovered path + why each node was chosen.
function RoutedCard({ color }) {
  const [data, setData] = React.useState(null);
  const [err, setErr] = React.useState(null);
  const load = React.useCallback(() => {
    setData(null); setErr(null);
    fetch("/api/route").then(r => r.json()).then(setData).catch(e => setErr(String(e)));
  }, []);
  React.useEffect(() => { load(); }, [load]);

  return html`
    <div class="card">
      <h2>Connector v1 — routed pathway (step 4: LLM-tool-calling router)</h2>
      <div class="body">
        <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
          <span class="sub">router: ${data ? data.router : "…"} (offline default; LLM is a swappable boundary)</span>
          <button onClick=${load} style=${{ padding: "4px 10px", fontSize: "11px" }}>↻ re-route</button>
        </div>
        ${err ? html`<span class="sub">route error: ${err}</span>` : null}
        ${!data && !err ? html`<span class="sub">routing…</span>` : null}
        ${data ? html`
          <div style=${{ marginBottom: "8px" }}>
            ${data.pathway.map((nt, i) => html`<span class="pill" key=${i}>${nt}</span>${i < data.pathway.length-1 ? " → " : ""}`)}
          </div>
          <div class="stream" style=${{ maxHeight: "200px" }}>
            ${data.decisions.map((d, i) => html`
              <div class="belief" key=${i}>
                <div class="top">
                  <span class="type" style=${{ color: color(d.layer) }}>${d.chosen || "stop"}${d.layer ? " ["+d.layer+"]" : ""}</span>
                  <span class="src">#${d.step}</span>
                </div>
                <div class="src">${d.reason}</div>
                <div class="src" style=${{ opacity: .7 }}>chose from: ${d.candidates.join(", ")}</div>
              </div>`)}
          </div>
        ` : null}
      </div>
    </div>`;
}

// --- Interlingua conformance (build-tracker step 5). The versioned shared-belief
// contract made visible: drift report over a run + coherence over the bank.
function InterlinguaCard() {
  const [data, setData] = React.useState(null);
  const [err, setErr] = React.useState(null);
  React.useEffect(() => {
    fetch("/api/conformance").then(r => r.json()).then(setData).catch(e => setErr(String(e)));
  }, []);
  return html`
    <div class="card">
      <h2>Interlingua conformance (step 5: versioned belief contract)</h2>
      <div class="body">
        ${err ? html`<span class="sub">conformance error: ${err}</span>` : null}
        ${!data && !err ? html`<span class="sub">checking conformance…</span>` : null}
        ${data ? html`
          <div class="kv"><span>interlingua version</span><span style=${{color:"#5eead4"}}>v${data.version}</span></div>
          <div class="kv"><span>catalogued belief types</span><span>${Object.keys(data.catalog).length}</span></div>
          <div class="kv"><span>run drift</span><span style=${{color: data.run_report.conforms ? "#34d399" : "#f87171"}}>
            ${data.run_report.conforms ? "✓ conforms" : (data.run_report.violations.length + " violation(s)")}
            (${data.run_report.n_conforming}/${data.run_report.n_beliefs})</span></div>
          <div class="kv"><span>coherence notes (loose types)</span><span>${data.coherence.length}</span></div>
          <div class="stream" style=${{ maxHeight: "150px", marginTop: "8px" }}>
            ${data.coherence.map((c, i) => html`
              <div class="belief" key=${i}>
                <div class="top"><span class="type">${c.belief_type}</span>
                  <span class="src">${c.sources.length} emitters</span></div>
                <div class="src">common: ${c.common_keys.join(", ") || "(none)"}</div>
                <div class="src" style=${{ opacity:.7 }}>divergent: ${c.divergent_keys.join(", ")}</div>
              </div>`)}
          </div>
          <div class="hint" style=${{ padding: "6px 0 0" }}>“loose” types (no required payload key) are candidates for tightening at the next interlingua version — surfaced as soft notes, not hard violations.</div>
        ` : null}
      </div>
    </div>`;
}

// --- Overview (landing): the WHOLE system at a glance — counts for every
// subsystem, build status, and clickable cards into each view. This is the answer
// to "I only see 4 nodes": you land here, not on the 4-node pathway.
function OverviewView({ color, setView }) {
  const [d, setD] = useState(null);
  useEffect(() => { fetch("/api/overview").then(r => r.json()).then(setD); }, []);
  if (!d) return html`<div class="card"><div class="body"><span class="sub">loading system overview…</span></div></div>`;
  const tiles = [
    ["models", d.models, "ML models"], ["layers", Object.keys(d.layers).length, "functional layers"],
    ["types", d.belief_types, "belief types"], ["files", d.n_files, "source files"],
    ["lines", d.total_lines, "lines of code"], ["tests", d.n_test_suites, "test suites"],
  ];
  return html`
    <div style=${{ padding: "4px" }}>
      <div class="card">
        <h2>Pattern Brain — full system (everything built so far)</h2>
        <div class="tiles">
          ${tiles.map(([k,v,l]) => html`<div class="tile" key=${k}>
            <div class="big">${v}</div><div class="lbl">${l}</div></div>`)}
        </div>
        <div class="hint">torch deep nodes: ${d.torch ? "ON" : "off"} · interlingua v${d.interlingua_version}. Click any subsystem below to open its view.</div>
      </div>
      <div class="card">
        <h2>Subsystems — click to open</h2>
        <div class="subsys">
          ${d.subsystems.map((s,i) => html`<div class="s" key=${i} onClick=${() => setView(s.tab)}>
            <div class="n">${s.name}<b>${s.count}</b></div><div class="d">${s.desc}</div></div>`)}
        </div>
      </div>
      <div class="card">
        <h2>Build progress</h2>
        <div class="body">
          ${d.build.map((b,i) => html`<div class="buildrow" key=${i}>
            <span style=${{ color: b.done ? "#34d399" : "#8aa0c8" }}>${b.done ? "✓" : "○"}</span>
            <span>${b.step}</span></div>`)}
        </div>
      </div>
      <div class="card">
        <h2>Models by functional layer</h2>
        <div class="body">
          ${Object.entries(d.layers).sort().map(([l,n]) => html`<div class="kv" key=${l}>
            <span style=${{ color: color(l) }}>${l}</span><span>${n}</span></div>`)}
        </div>
      </div>
    </div>`;
}

// --- Files view: every source file in the project (core + tests + dashboard).
function FilesView() {
  const [d, setD] = useState(null);
  const [q, setQ] = useState("");
  useEffect(() => { fetch("/api/files").then(r => r.json()).then(setD); }, []);
  if (!d) return html`<div class="card"><div class="body"><span class="sub">loading files…</span></div></div>`;
  const rows = d.files.filter(f => f.path.toLowerCase().includes(q.toLowerCase()));
  return html`
    <div style=${{ padding: "4px" }}>
      <div class="card">
        <h2>Project files — ${d.n_files} files, ${d.total_lines} lines (every .py / .html)</h2>
        <div class="body">
          <input placeholder="filter by path…" value=${q} onInput=${e => setQ(e.target.value)}
                 style=${{ width: "100%", background: "var(--panel2)", color: "var(--txt)",
                          border: "1px solid var(--line)", borderRadius: "6px", padding: "6px 10px",
                          marginBottom: "8px", fontFamily: "inherit" }} />
          <div style=${{ maxHeight: "560px", overflow: "auto" }}>
            <table class="ftable">
              <thead><tr><th>file</th><th>kind</th><th>lines</th><th>summary</th></tr></thead>
              <tbody>
                ${rows.map((f,i) => html`<tr key=${i}>
                  <td>${f.path}</td><td><span class="kindtag">${f.kind}</span></td>
                  <td class="num">${f.lines}</td><td style=${{ color: "#bcd" }}>${f.summary}</td></tr>`)}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>`;
}

// --- Evaluator view: the 5-layer admission gate made visible (edge vs noise).
function EvaluatorView() {
  const [d, setD] = useState(null);
  useEffect(() => { fetch("/api/evaluator").then(r => r.json()).then(setD); }, []);
  if (!d) return html`<div class="card"><div class="body"><span class="sub">running the evaluator…</span></div></div>`;
  const verdict = (r) => html`
    <div class="kv"><span>observations</span><span>${r.n_obs}</span></div>
    <div class="kv"><span>Sharpe</span><span>${r.sharpe.toFixed(3)}</span></div>
    <div class="kv"><span>PSR</span><span>${r.psr.toFixed(3)}</span></div>
    <div class="kv"><span>DSR (deflated)</span><span>${r.dsr.toFixed(3)}</span></div>
    <div class="kv"><span>verdict</span><span style=${{ color: r.passed ? "#34d399" : "#f87171" }}>
      ${r.passed ? "✓ PASSES gate" : "✗ rejected"}</span></div>
    ${r.reasons && r.reasons.length ? html`<div class="src" style=${{ color: "#f87171" }}>${r.reasons.join("; ")}</div>` : null}`;
  return html`
    <div style=${{ padding: "4px" }}>
      <div class="card">
        <h2>5-layer Evaluator — the hard gate Features 1/2/3 use</h2>
        <div class="body">
          ${d.layers.map((l,i) => html`<div class="buildrow" key=${i}><span style=${{color:"#5eead4"}}>L${i}</span><span>${l.slice(3)}</span></div>`)}
          <div class="hint" style=${{ padding: "8px 0 0" }}>${d.folds.length} purged walk-forward folds over ${d.n_samples} samples (no leakage).</div>
        </div>
      </div>
      <div class="adapter-grid">
        <div class="card"><h2>Candidate WITH a real edge</h2><div class="body">${verdict(d.edge)}</div></div>
        <div class="card"><h2>Pure-noise candidate</h2><div class="body">${verdict(d.noise)}</div></div>
      </div>
    </div>`;
}

// --- Evolution view: Features 1/2/3 — the candidates born -> tested -> promoted.
function EvolutionView({ color }) {
  const [d, setD] = useState(null);
  useEffect(() => { fetch("/api/evolution").then(r => r.json()).then(setD); }, []);
  if (!d) return html`<div class="card"><div class="body"><span class="sub">running the evolution engines (a few seconds)…</span></div></div>`;
  const labels = { feature1_model: "Feature 1 — Model mutation",
                   feature3_pathway: "Feature 3 — Pathway evolution",
                   feature2_algorithm: "Feature 2 — Algorithm (GP) evolution" };
  const evColor = (e) => e === "promoted" ? "#34d399" : e === "born" ? "#fbbf24" : "#8aa0c8";
  return html`
    <div style=${{ padding: "4px" }}>
      ${Object.entries(d.features).map(([f, fd]) => html`
        <div class="card" key=${f}>
          <h2>${labels[f] || f} — ${fd.admitted} admitted through the gate</h2>
          <div class="body">
            <div class="kv"><span>best genome</span><span style=${{ color: "#5eead4", maxWidth: "70%", textAlign: "right" }}>${JSON.stringify(fd.best ? fd.best.genome : null)}</span></div>
            <div class="stream" style=${{ maxHeight: "150px", marginTop: "8px" }}>
              ${fd.events.map((e,i) => html`<div class="belief" key=${i}>
                <div class="top"><span class="type" style=${{ color: evColor(e.event) }}>${e.event}${e.origin ? " ("+e.origin+")" : ""}</span>
                  <span class="conf">${e.ucb != null ? "ucb " + e.ucb.toFixed(3) : ""}</span></div>

// --- Network (Phase 8 §12): the actual interconnected Stacked-DAG drawn as a graph
// (input → base ML modules → combiner → output distribution) + the leaderboard of
// which combinations score best, with the anti-overfit (DSR) guard.
const _ioStyle = (c) => ({ background: "#0f1830", color: c, border: "1.5px solid " + c,
  borderRadius: "8px", padding: "6px 10px", fontSize: "11px", width: 118,
  whiteSpace: "pre-line", textAlign: "center" });

// Build a ReactFlow graph from a DAGSpec: input → [layers of model nodes] → combiner → output.
function dagFlow(spec) {
  const nodes = [], edges = [];
  const colX = (c) => 30 + c * 195;
  nodes.push({ id: "in", position: { x: colX(0), y: 140 },
    data: { label: "📥 input\n(T, D)" }, style: _ioStyle("#38bdf8"),
    sourcePosition: "right", targetPosition: "left" });
  let prev = ["in"], col = 1;
  (spec.layers || []).forEach((layer, li) => {
    const ids = [];
    layer.forEach((nt, ni) => {
      const id = `l${li}_${ni}`; ids.push(id);
      nodes.push({ id, position: { x: colX(col), y: 40 + ni * 85 },
        data: { label: nt }, style: nodeStyle("sequence", true),
        sourcePosition: "right", targetPosition: "left" });
      prev.forEach(p => edges.push({ id: `${p}-${id}`, source: p, target: id, animated: true,
        style: { stroke: "#5eead4", strokeWidth: 2 }, markerEnd: { type: MarkerType.ArrowClosed } }));
    });
    prev = ids; col++;
  });
  nodes.push({ id: "comb", position: { x: colX(col), y: 140 },
    data: { label: `🔀 combiner\n${spec.combiner}` }, style: _ioStyle("#fbbf24"),
    sourcePosition: "right", targetPosition: "left" });
  prev.forEach(p => edges.push({ id: `${p}-comb`, source: p, target: "comb", animated: true,
    style: { stroke: "#fbbf24", strokeWidth: 2 }, markerEnd: { type: MarkerType.ArrowClosed } }));
  nodes.push({ id: "out", position: { x: colX(col + 1), y: 140 },
    data: { label: "📤 prediction\n(distribution)" }, style: _ioStyle("#34d399"), targetPosition: "left" });
  edges.push({ id: "comb-out", source: "comb", target: "out", animated: true,
    style: { stroke: "#34d399", strokeWidth: 2 }, markerEnd: { type: MarkerType.ArrowClosed } });
  return { nodes, edges };
}

// --- Capstone (Phase 8 §12.1): the freeze→forward-test — predicted distribution
// (q10–q90 fan + median) vs the realized path on the unseen holdout, + the verdict.

  useEffect(() => {
    if (!d || !d.forward_paths || !ref.current || !window.Plotly) return;
    const p = d.forward_paths, x = p.index;

      { x: x.concat([...x].reverse()), y: p.q90.concat([...p.q10].reverse()),
        fill: "toself", fillcolor: "rgba(94,234,212,0.15)", line: { color: "transparent" },
        name: "q10–q90", type: "scatter" },
      { x, y: p.q50, line: { color: "#5eead4", width: 1.5 }, name: "forecast median", type: "scatter" },
      { x, y: p.realized, line: { color: "#fbbf24", width: 1.5 }, name: "realized", type: "scatter" },
    ], { margin: { l: 36, r: 10, t: 10, b: 24 }, height: 320, paper_bgcolor: "transparent",

  const vColor = d.verdict === "PASS" ? "#34d399" : d.verdict === "WEAK" ? "#fbbf24" : "#f87171";
  const f = (v, n=3) => v==null ? "—" : (+v).toFixed(n);
  return html`<div class="wrap"><div class="col" style=${{ flex: 1 }}>
    <div class="card">
      <h2>🎯 Capstone — frozen network forecast vs the unseen future
        <span style=${{ color: vColor, marginLeft: "8px" }}>${d.verdict}</span></h2>
      <div class="body">
        <span class="sub">${d.symbol||"series"} · searched ${d.n_nets_searched} nets on ${d.n_history} history rows →
        FROZE the best → forward-tested on ${d.n_holdout} UNSEEN rows. The band is the forecast q10–q90; gold is reality.</span>
        <div ref=${ref} style=${{ marginTop: "8px" }}></div>
      </div>
    </div>
    <div class="card"><h2>the verdict, honestly</h2><div class="body">
      <table class="ftable">
        <tbody>
          <tr><td>forward CRPS-skill vs persistence</td><td class="num" style=${{ color: d.forward_skill>0?"#34d399":"#f87171" }}>${f(d.forward_skill)}</td></tr>
          <tr><td>Deflated Sharpe (deflated by nets tried)</td><td class="num">${f(d.forward_dsr)}</td></tr>
          <tr><td>distribution calibrated (PIT)</td><td class="num">${d.forward_calibrated ? "✓ yes" : "✗ no"}</td></tr>
          <tr><td>directional hit-rate (net vs baseline)</td><td class="num">${f(d.net_directional_hit,2)} vs ${f(d.baseline_directional_hit,2)}</td></tr>
          <tr><td>next move (mean, P↑)</td><td class="num">${f(d.next_move&&d.next_move.mean,4)} (${f(d.next_move&&d.next_move.prob_up,2)})</td></tr>
        </tbody>
      </table>
      <span class="sub">Honest read: a PASS here is DISTRIBUTIONAL (the net forecasts the next-return spread/uncertainty
      better than naive persistence, DSR-significant) — direction stays ≈ chance. The whole point is that this number
      is trustworthy: the net was FROZEN before it ever saw the holdout.</span>
    </div></div>
  </div></div>`;
}

// Full-bank view: ALL modules in their 8 functional-layer columns + the allowed
// forward (layer-adjacent) connections — the whole "brain" / search space.
const _LAYER_ORDER = ["signal","noise","pattern","sequence","probability","equation","decision","rl"];
function bankNodeStyle(layer, isWinner, sk) {
  const base = nodeStyle(layer, false);
  const skillPos = sk && sk.skill != null && sk.skill > 0;
  return { ...base, fontSize: "8px", width: 158, padding: "2px 5px",
    opacity: isWinner ? 1 : 0.28,
    border: isWinner ? "2px solid #fde047" : base.border,
    boxShadow: isWinner ? "0 0 11px #fde047" : (skillPos ? "0 0 5px #34d399" : "none") };
}
function bankFlow(bankNodes, winnerSet, skills) {
  winnerSet = winnerSet || new Set(); skills = skills || {};
  const byLayer = {};
  (bankNodes || []).forEach(n => { (byLayer[n.layer] = byLayer[n.layer] || []).push(n); });
  const layers = _LAYER_ORDER.filter(l => byLayer[l]).concat(Object.keys(byLayer).filter(l => !_LAYER_ORDER.includes(l)));
  const nodes = [], edges = [];
  layers.forEach((l, li) => byLayer[l].forEach((n, ni) => {
    nodes.push({ id: n.node_type, position: { x: li*240, y: ni*30 },
      data: { label: n.node_type }, style: bankNodeStyle(l, winnerSet.has(n.node_type), skills[n.node_type]),
      sourcePosition: "right", targetPosition: "left" });
  }));
  for (let li = 0; li < layers.length - 1; li++) {
    const cur = byLayer[layers[li]], nxt = byLayer[layers[li+1]];
    cur.forEach((n, ni) => { for (let j = 0; j < 2; j++) {
      const t = nxt[(ni + j) % nxt.length];
      edges.push({ id: `${n.node_type}>${t.node_type}.${j}`, source: n.node_type, target: t.node_type,
        style: { stroke: color(layers[li]), strokeWidth: 0.5, opacity: 0.18 } });
    }});
  }
  return { nodes, edges };
}

function NetworkView() {
  const [d, setD] = useState(null);
  const [sel, setSel] = useState(0);
  const [mode, setMode] = useState("winner");
  const [bank, setBank] = useState(null);

  useEffect(() => { fetch("/api/leaderboard").then(r => r.json()).then(setD).catch(()=>{}); }, []);
  useEffect(() => { if (mode === "bank" && !bank) fetch("/api/bank").then(r => r.json()).then(setBank).catch(()=>{}); }, [mode]);
  useEffect(() => {                                   // poll the background OOF-skill sweep
    if (mode !== "bank") return; let stop = false;
    const tick = () => fetch("/api/node_skill").then(r => r.json()).then(x => {
      if (stop) return; setSkill(x); if (!x.ready) setTimeout(tick, 3000);
    }).catch(()=>{});
    tick(); return () => { stop = true; };

  if (!d) return html`<div class="wrap"><div class="card"><h2>🏆 Network</h2>

    <div class="card">

          : html`The winning Stacked-DAG #${Math.min(sel,top.length-1)+1}: raw data → base ML modules → ${spec ? spec.combiner : ""} combiner → predictive distribution. Click a leaderboard row to draw a different net.`}</span>
        ${mode === "bank" && skill && !skill.ready ? html`<div><span class="sub">⏳ scoring modules (out-of-fold)… ${skill.n_done}/${skill.n_total||"…"}</span></div>` : ""}
        ${mode === "bank" && selNode ? html`<div style=${{ marginTop: "6px", padding: "5px 8px", background: "var(--panel2)", borderRadius: "6px" }}>
          <b>${selNode}</b> — ${selSkill
            ? html`OOF CRPS-skill <b style=${{ color: (selSkill.skill||0)>0 ? "#34d399" : "#f87171" }}>${selSkill.skill==null ? "—" : (+selSkill.skill).toFixed(3)}</b> · CRPS ${selSkill.crps==null?"—":(+selSkill.crps).toFixed(3)} · n=${selSkill.n}`
            : html`<span class="sub">not a forecaster — contributes as a FEATURE to the stack, not as a direct predictor (no forecast skill).</span>`}
        </div>` : ""}
        <div id="dag" style=${{ height: "420px", border: "1px solid var(--line)", borderRadius: "8px", marginTop: "8px" }}>
          ${flow.nodes.length ? html`<${ReactFlow} nodes=${flow.nodes} edges=${flow.edges} fitView
              onNodeClick=${(e, node) => setSelNode(node.id)}
              proOptions=${{ hideAttribution: true }} nodesDraggable=${false} nodesConnectable=${false} minZoom=${0.05}>
              <${Background} color="#26314f" gap=${20} />
              <${Controls} showInteractive=${false} />
            <//>` : html`<div class="body"><span class="sub">${mode==="bank" ? "loading all modules…" : "no network yet — run the search."}</span></div>`}
        </div>
      </div>
    </div>
    <div class="card">
      <h2>🏆 Leaderboard — which combinations score best</h2>
      <div class="body">
        <span class="sub">runs ${s.n_runs} · distinct nets ${s.n_specs} · beat baseline ${s.n_beat_baseline} · DSR-significant ${s.n_dsr_significant}
        · best skill ${s.best_skill==null ? "—" : (+s.best_skill).toFixed(3)} (${s.best_combiner||"—"})</span>
        <table class="ftable" style=${{ marginTop: "10px" }}>
          <thead><tr><th>#</th><th>combiner</th><th>nodes</th><th class="num">CRPS</th>
            <th class="num">skill</th><th class="num">calib KS</th><th>modules</th></tr></thead>

              <td class="num" style=${{ color: r.crps_skill>0 ? "#34d399" : "#f87171" }}>${(+r.crps_skill).toFixed(3)}</td>
              <td class="num">${(+r.calib_ks).toFixed(3)}${r.calibrated ? " ✓" : ""}</td>
              <td><span class="sub">${JSON.parse(r.spec_json).layers.map(l=>l.join(" + ")).join(" → ")}</span></td>

// --- Galton board: the "magic of probability" — drop balls through pegs (50/50
// each), watch the Binomial histogram converge to the Normal (the CLT, live). The
// intuition pump for the probability layer: individual chance -> collective law.
function GaltonView() {
  const [rows, setRows] = useState(12);
  const [balls, setBalls] = useState(2000);
  const [d, setD] = useState(null);
  const ref = useRef(null);
  const load = useCallback((r, n) => {
    fetch(`/api/galton?rows=${r}&balls=${n}`).then(x => x.json()).then(setD);
  }, []);
  useEffect(() => { load(rows, balls); }, []);
  useEffect(() => {
    if (!d || !ref.current || !window.Plotly) return;
    window.Plotly.react(ref.current, [
      { type: "bar", x: d.bins, y: d.counts, name: "balls (random)",
        marker: { color: "#5eead4" } },
      { type: "scatter", mode: "lines", x: d.bins, y: d.normal, name: "Normal (CLT)",
        line: { color: "#f59e0b", width: 3 } },
      { type: "scatter", mode: "markers", x: d.bins, y: d.binomial, name: "Binomial (exact)",
        marker: { color: "#7dd3fc", size: 6 } },
    ], {
      margin: { l: 40, r: 10, t: 10, b: 36 }, height: 420,
      paper_bgcolor: "transparent", plot_bgcolor: "transparent",
      font: { color: "#8aa0c8", size: 11 }, bargap: 0.05,
      legend: { orientation: "h", y: 1.1 },
      xaxis: { title: "bin (number of right-bounces)", gridcolor: "#26314f" },
      yaxis: { title: "ball count", gridcolor: "#26314f" },
    }, { displayModeBar: false });
  }, [d]);
  return html`
    <div style=${{ padding: "4px" }}>
      <div class="card">
        <h2>🎲 The Galton board — the magic of probability</h2>
        <div class="hint">Each ball bounces left/right (50/50) through ${rows} rows of pegs and lands in a bin.
          No single ball is predictable — yet thousands always pile into the same bell curve.
          The bars are <b style=${{color:"#5eead4"}}>random balls</b>; they track the
          <b style=${{color:"#7dd3fc"}}>exact Binomial</b> and converge to the
          <b style=${{color:"#f59e0b"}}>Normal</b> (the Central Limit Theorem, live). This is the
          probability layer's whole premise: bet on the distribution, not the coin flip.</div>
        ${d ? html`<div class="hint">mean = ${d.mean}, std = ${d.std}, balls = ${d.balls}</div>` : null}
        <div class="body"><div ref=${ref}></div></div>
        <div style=${{ display: "flex", gap: "16px", alignItems: "center", flexWrap: "wrap" }}>
          <label>rows (pegs): ${rows}
            <input type="range" min="4" max="24" value=${rows}
                   onInput=${e => { const r=+e.target.value; setRows(r); load(r, balls); }} /></label>
          <label>balls: ${balls}
            <input type="range" min="100" max="50000" step="100" value=${balls}
                   onInput=${e => { const n=+e.target.value; setBalls(n); load(rows, n); }} /></label>
          <button onClick=${() => load(rows, balls)}>🎲 drop again (new random run)</button>
          <button onClick=${() => { const n=Math.min(balls+5000,50000); setBalls(n); load(rows,n);}}>+5000 balls</button>
        </div>
      </div>
    </div>`;
}

// --- ML Engineer Agent view (ENG-4): LLM engine + knowledge base + the live
// closed loop + a chat box to converse with the agent like a Claude session.
function EngineerView({ color }) {
  const [kn, setKn] = useState(null);
  const [status, setStatus] = useState(null);
  const [feed, setFeed] = useState([]);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [chat, setChat] = useState([]);
  const [pending, setPending] = useState(null);
  const [actBusy, setActBusy] = useState(false);
  const [ideas, setIdeas] = useState([]);
  const [genBusy, setGenBusy] = useState(false);
  const refresh = useCallback(() => {
    fetch("/api/knowledge").then(r => r.json()).then(setKn);
    fetch("/api/agent/status").then(r => r.json()).then(setStatus);
    fetch("/api/advisor/ideas").then(r => r.json()).then(d => setIdeas(d.ideas || []));
  }, []);
  useEffect(() => { refresh(); }, [refresh]);
  const genIdeas = async () => {
    setGenBusy(true);
    try { const d = await fetch("/api/advisor/generate", {method:"POST"}).then(x=>x.json());
          setIdeas(d.ideas || []); } finally { setGenBusy(false); }
  };
  const setIdeaStatus = async (id, status) => {
    const d = await fetch("/api/advisor/status", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({id, status})}).then(x=>x.json());
    setIdeas(d.ideas || []);
  };

  const runStep = async () => {
    setBusy(true);
    try {
      const r = await fetch("/api/agent/step", { method: "POST" }).then(x => x.json());
      setFeed(f => [r.result, ...f].slice(0, 50));
      setStatus(r.status);
    } finally { setBusy(false); }
  };
  const send = async () => {
    const m = msg.trim(); if (!m) return;
    setChat(c => [...c, { role: "user", content: m }]); setMsg("");
    const r = await fetch("/api/agent/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: m }) }).then(x => x.json());
    setChat(c => [...c, { role: "assistant", content: r.reply }]);
    setPending(r.pending || null);
  };
  const confirmAct = async (approve) => {
    if (!pending) return;
    setActBusy(true);
    try {
      const r = await fetch("/api/agent/confirm", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: pending.id, approve }) }).then(x => x.json());
      setChat(c => [...c, { role: "assistant", content: r.reply }]);
      setPending(null);
      refresh();
    } finally { setActBusy(false); }
  };
  const consolidate = async () => {
    const r = await fetch("/api/agent/consolidate", { method: "POST" }).then(x => x.json());
    setKn(k => k ? { ...k, stats: r.stats } : k);
  };

  const inp = { background: "var(--panel2)", color: "var(--txt)", border: "1px solid var(--line)",
                borderRadius: "6px", padding: "8px 10px", fontFamily: "inherit", width: "100%" };
  const llm = kn && kn.llm;
  return html`
    <div style=${{ padding: "4px" }}>
      <div class="card">
        <h2>🤖 The ML Engineer — autonomous continuous-learning loop</h2>
        <div class="hint">Observe → Orient (literature + memory) → Decide (AIDE draft/improve) →
          Act (create/mutate models, algorithms, pathways) → Rank (Evaluator gate) →
          promote winners into the model nodes. Runs forever; here you can drive it step-by-step and talk to it.</div>
        ${status ? html`<div class="tiles">
          <div class="tile"><div class="big">${status.steps_done}</div><div class="lbl">loop steps</div></div>
          <div class="tile"><div class="big">${status.promotions}</div><div class="lbl">models promoted</div></div>
          <div class="tile"><div class="big">${status.llm ? "LLM" : "offline"}</div><div class="lbl">brain</div></div>
          <div class="tile"><div class="big">${status.stopped ? "STOP" : "ready"}</div><div class="lbl">state</div></div>
        </div>` : null}
        <div style=${{ marginTop: "8px" }}>
          <button onClick=${runStep} disabled=${busy}>${busy ? "running…" : "▶ Run one loop step"}</button>
          <button onClick=${refresh} style=${{ marginLeft: "8px" }}>↻ refresh</button>
        </div>
      </div>

      <div class="card">
        <h2>🧠 LLM Engine (the agent's brain) — Block 56 sweep</h2>
        <div class="body">
          ${llm ? html`
            <div class="kv"><span>active backend</span><span style=${{ color: "#5eead4" }}>${llm.router}</span></div>
            <div class="kv"><span>cloud available</span><span>${(llm.cloud_available||[]).join(", ") || "none (set a key)"}</span></div>
            <div class="kv"><span>local Ollama</span><span>${llm.ollama_available ? "✓" : "—"}</span></div>
            <div style=${{ marginTop: "8px" }}>priority chain:</div>
            <div>${(llm.chain||[]).map((c,i) => html`<span class="kindtag" key=${i} style=${{ margin: "2px" }}>${c}</span>`)}</div>
            <div class="hint">Cloud-primary for reasoning, local Ollama + offline heuristic as fallback. Set ZAI_API_KEY / DEEPSEEK_API_KEY / etc. to light up the free clouds.</div>
          ` : html`<span class="sub">loading…</span>`}
        </div>
      </div>

      <div class="card">
        <h2>📚 Knowledge Base (books → vector DB) + the agent's memory</h2>
        <div class="body">
          ${kn ? html`
            <div class="kv"><span>passages indexed</span><span>${kn.stats.passages}</span></div>
            <div class="kv"><span>archival memories (own findings)</span><span>${kn.stats.archival}</span></div>
            <div class="kv"><span>consolidated Q&A (first-class knowledge)</span><span>${(kn.stats.sources && kn.stats.sources.consolidated_qa) || 0}</span></div>
            <div class="kv"><span>embedder</span><span>${kn.stats.embedder} (dim ${kn.stats.dim})</span></div>
            <div style=${{ marginTop: "8px" }}>
              <button onClick=${async () => { await fetch("/api/agent/ingest_books", {method:"POST"}); refresh(); }}>
                📥 Ingest books → vector DB now</button>
              <button onClick=${consolidate} style=${{ marginLeft: "8px" }}>♻ Consolidate Q&A → knowledge</button>
              <span class="sub" style=${{ marginLeft: "8px" }}>(books also auto-ingest on startup; good chat answers are auto-promoted periodically)</span>
            </div>
            <div style=${{ marginTop: "8px" }}>Open-access ML-engineering corpus (fetched on demand):</div>
            ${kn.books.map((b,i) => html`<div class="kv" key=${i}>
              <span><a href=${b.url} target="_blank" style=${{ color: "#7dd3fc" }}>${b.title}</a></span>
              <span class="kindtag">${b.kind}</span></div>`)}
          ` : html`<span class="sub">loading…</span>`}
        </div>
      </div>

      <div class="card">
        <h2>💬 Talk to the ML Engineer</h2>
        <div class="body">
          <div style=${{ maxHeight: "260px", overflow: "auto", marginBottom: "8px" }}>
            ${chat.length === 0 ? html`<span class="sub">Ask it anything — e.g. "what's the state of the bank?" or "what should we try next?"</span>` : null}
            ${chat.map((m,i) => html`<div key=${i} style=${{ margin: "6px 0" }}>
              <b style=${{ color: m.role === "user" ? "#7dd3fc" : "#5eead4" }}>${m.role === "user" ? "you" : "ML Engineer"}:</b>
              <div style=${{ whiteSpace: "pre-wrap" }}>${m.content}</div></div>`)}
          </div>
          ${pending ? html`<div style=${{ border: "1px solid #f59e0b", background: "var(--panel2)",
              borderRadius: "6px", padding: "8px 10px", margin: "6px 0" }}>
            <div>⏸ <b>Confirm a real run</b> — the agent wants to:</div>
            <div style=${{ color: "#fcd34d", margin: "4px 0" }}>${pending.desc}</div>
            <button onClick=${() => confirmAct(true)} disabled=${actBusy}>${actBusy ? "running…" : "✓ Confirm & run"}</button>
            <button onClick=${() => confirmAct(false)} disabled=${actBusy} style=${{ marginLeft: "6px" }}>✕ Cancel</button>
          </div>` : null}
          <div style=${{ display: "flex", gap: "8px" }}>
            <input style=${inp} placeholder=${'message the agent… (try "run a DAG search on BTC/USD")'} value=${msg}
                   onInput=${e => setMsg(e.target.value)}
                   onChange=${e => setMsg(e.target.value)}
                   onKeyDown=${e => { if (e.key === "Enter") send(); }} />
            <button onClick=${send}>send</button>
          </div>
          <div class="hint" style=${{ marginTop: "6px" }}>Read-only by default; "run …" requests are gated — they execute only after you Confirm.</div>
        </div>
      </div>

      <div class="card">
        <h2>💡 Ideation & Research Advisor (Rule 26) — ideas it proposes for you</h2>
        <div class="hint">Turns your goals into advanced concepts/architectures you didn't have to think of —
          grounded in the project state + literature. Each idea carries the search queries to verify it and a
          concrete proposed change. It only <b>proposes</b>; you approve, then it gets built.</div>
        <div style=${{ margin: "8px 0" }}>
          <button onClick=${genIdeas} disabled=${genBusy}>${genBusy ? "thinking…" : "💡 Generate ideas"}</button>
          <button onClick=${refresh} style=${{ marginLeft: "8px" }}>↻ refresh</button>
        </div>
        <div class="body">
          ${ideas.length === 0 ? html`<span class="sub">No ideas yet — click "Generate ideas".</span>` : null}
          ${ideas.map((it,i) => html`<div key=${i} style=${{ borderLeft: "3px solid "
              + (it.status==="approved" ? "#34d399" : it.status==="dismissed" ? "#6b7280" : "#f59e0b"),
              padding: "6px 10px", margin: "8px 0", background: "var(--panel2)", borderRadius: "6px" }}>
            <div><b style=${{ color: "#e5e7eb" }}>${it.title}</b>
              <span class="kindtag" style=${{ marginLeft: "6px" }}>${it.status}</span>
              <span class="kindtag">${it.source}</span></div>
            <div class="sub">elo ${Math.round(it.elo || 1000)} · feasibility ${(it.feasibility ?? 0.5).toFixed(2)} · novelty ${(it.novelty ?? 0.5).toFixed(2)}</div>
            <div style=${{ color: "#bcd", margin: "4px 0" }}>${it.concept}</div>
            ${it.critique ? html`<div class="sub" style=${{ fontStyle: "italic" }}>critique: ${it.critique}</div>` : null}
            <div class="sub">why: ${it.why}</div>
            <div class="sub">proposed: ${it.proposed_change}</div>
            <div class="sub">🔎 ${(it.search_queries||[]).join("  ·  ")}</div>
            <div style=${{ marginTop: "4px" }}>
              <button onClick=${() => setIdeaStatus(it.id, "approved")}>✓ approve</button>
              <button onClick=${() => setIdeaStatus(it.id, "dismissed")} style=${{ marginLeft: "6px" }}>✕ dismiss</button>
            </div>
          </div>`)}
        </div>
      </div>

      <div class="card">
        <h2>⚙️ Live loop feed (born → tested → gated → promoted)</h2>
        <div class="body">
          ${feed.length === 0 ? html`<span class="sub">Click "Run one loop step" to watch the agent work.</span>` : null}
          ${feed.map((r,i) => html`<div class="buildrow" key=${i}>
            <span style=${{ color: r.promoted ? "#34d399" : "#8aa0c8" }}>${r.promoted ? "✓" : "○"}</span>
            <span>#${r.step} <b style=${{ color: color(r.feature && r.feature.includes("pathway") ? "decision" : "sequence") }}>${r.feature}</b>
              [${r.mode}] — ${r.finding}</span></div>`)}
        </div>
      </div>
    </div>`;
}

function App() {
  const [meta, setMeta] = useState({});       // node_type -> metadata
  const [nodes, setNodes] = useState([]);
  const [edges, setEdges] = useState([]);
  const [beliefs, setBeliefs] = useState([]); // ordered belief stream
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const [selected, setSelected] = useState(null);
  const [view, setView] = useState("overview");   // landing on the full-system overview
  const plotRef = useRef(null);

  // Load the hardcoded pathway + node metadata on mount.
  useEffect(() => {
    fetch("/api/pathway").then(r => r.json()).then(d => {
      const m = {}; d.nodes.forEach(n => { m[n.node_type] = n; });
      setMeta(m);
      buildGraph(d.pathway, m, {});
    });
  }, []);

  function buildGraph(pathway, m, fired) {
    setNodes(pathway.map((nt, i) => ({
      id: String(i),
      position: { x: i * 210 + 20, y: 150 },
      data: { label: `${nt}\n[${(m[nt]||{}).layer||"?"}]`, node_type: nt },
      style: nodeStyle((m[nt]||{}).layer, !!fired[i]),
      sourcePosition: "right", targetPosition: "left",
    })));
    setEdges(pathway.slice(1).map((nt, i) => ({
      id: `e${i}`, source: String(i), target: String(i+1),
      animated: !!fired[i+1],
      style: { stroke: fired[i+1] ? color((m[nt]||{}).layer) : "#33406a", strokeWidth: fired[i+1] ? 3 : 1.5 },
      markerEnd: { type: MarkerType.ArrowClosed },
    })));
  }

  const start = useCallback(() => {
    setBeliefs([]); setDone(false); setRunning(true); setSelected(null);
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws/run`);
    let pathway = []; const fired = {}; const confs = [];
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.event === "start") { pathway = msg.pathway; buildGraph(pathway, meta, {}); }
      else if (msg.event === "hop") {
        const h = msg.hop; fired[h.step] = true;
        buildGraph(pathway, meta, { ...fired });
        setBeliefs(prev => [...prev, { ...h.belief, _step: h.step, _transformed: h.transformed }]);
        confs.push({ name: h.node_type, conf: h.belief.confidence });
        drawPlot(confs);
      } else if (msg.event === "done") { setRunning(false); setDone(true); }
    };
    ws.onerror = () => setRunning(false);
    ws.onclose = () => setRunning(false);
  }, [meta]);

  function drawPlot(confs) {
    if (!plotRef.current || !window.Plotly) return;
    window.Plotly.react(plotRef.current, [{
      type: "bar", orientation: "h",
      x: confs.map(c => c.conf), y: confs.map(c => c.name),
      marker: { color: "#5eead4" },
    }], {
      margin: { l: 110, r: 10, t: 6, b: 24 }, height: 150,
      paper_bgcolor: "transparent", plot_bgcolor: "transparent",
      font: { color: "#8aa0c8", size: 10 },
      xaxis: { range: [0, 1], gridcolor: "#26314f", title: "confidence" },
    }, { displayModeBar: false });
  }

  const onNodeClick = (_e, n) => setSelected(meta[n.data.node_type] || null);

  return html`
    <div>
      <header>
        <h1>🧠 Pattern Brain</h1>
        <div class="tabs">
          ${[["overview","Overview"],["engineer","🤖 ML Engineer"],["network","🏆 Network"],["capstone","🎯 Capstone"],["coverage","📊 Coverage"],["galton","🎲 Galton"],["bank","Model Bank"],["evaluator","Evaluator"],
             ["evolution","Evolution"],["pathways","Pathways"],["living","Living Graph"],
             ["adapter","Adapter"],["files","Files"]].map(([k,label]) => html`
            <button key=${k} class=${"tab" + (view===k ? " active" : "")}
                    onClick=${() => setView(k)}>${label}</button>`)}
        </div>
        <div style=${{ marginLeft: "auto", display: "flex", gap: "12px", alignItems: "center" }}>
          ${view==="living" ? html`
            <span class="sub">${done ? "✓ run complete" : running ? "● running…" : "idle"}</span>
            <button onClick=${start} disabled=${running}>${running ? "running…" : "▶ Run pathway"}</button>
          ` : null}
        </div>
      </header>

      ${view === "overview" ? html`<${OverviewView} color=${color} setView=${setView} />`
        : view === "engineer" ? html`<${EngineerView} color=${color} />`
        : view === "network" ? html`<${NetworkView} />`
        : view === "capstone" ? html`<${CapstoneView} />`
        : view === "coverage" ? html`<${CoverageView} />`
        : view === "galton" ? html`<${GaltonView} />`
        : view === "files" ? html`<${FilesView} />`
        : view === "evaluator" ? html`<${EvaluatorView} />`
        : view === "evolution" ? html`<${EvolutionView} color=${color} />`
        : view === "pathways" ? html`<${PathwaysView} />`
        : view === "adapter" ? html`<${AdapterView} />`
        : view === "bank" ? html`<${BankView} color=${color} />` : html`
      <div class="wrap">
        <div class="col">
          <div class="card">
            <h2>Living Graph — belief flows left→right along the hardcoded pathway</h2>
            <div id="graph">
              <${ReactFlow} nodes=${nodes} edges=${edges} onNodeClick=${onNodeClick}
                            fitView proOptions=${{ hideAttribution: true }}
                            nodesDraggable=${false} nodesConnectable=${false}>
                <${Background} color="#26314f" gap=${20} />
                <${Controls} showInteractive=${false} />
              <//>
            </div>
            <div class="legend">
              ${Object.keys(LAYER_COLOR).map(l => html`<span key=${l}><i style=${{ background: color(l) }}></i>${l}</span>`)}
            </div>
            <div class="hint">A node glows when it fires; the edge into it animates as the signal bus is handed on (transformer nodes rewrite the bus, others tap it). Click a node to inspect it.</div>
          </div>

          <div class="card">
            <h2>Per-node confidence (Plotly)</h2>
            <div class="body"><div ref=${plotRef}></div></div>
          </div>

          <${RoutedCard} color=${color} />


          <div class="card">
            <h2>Views arriving with later build steps</h2>
            <div class="body future">
              <div class="f"><b>Pathway Leaderboard</b>regime-split reputation per pathway — needs Feature 3 (final phase)</div>
              <div class="f"><b>Evaluator / Test panel</b>walk-forward splits, DSR/PSR, NSGA-II Pareto — needs the evaluator (final phase)</div>
              <div class="f"><b>World Model ribbon</b>detected regime timeline — needs regime routing (step 4)</div>
              <div class="f"><b>Evolution feed</b>candidates born→tested→promoted — needs Features 1/2/3 (final phase)</div>
              <div class="f" style=${{ opacity: 1, borderStyle: "solid" }}><b style=${{ color: "#5eead4" }}>Adapter View (stock) ✓</b>built (step 3) — see the tab above; the ONLY stock-specific tab (Rule 23)</div>
              <div class="f" style=${{ opacity: 1, borderStyle: "solid" }}><b style=${{ color: "#5eead4" }}>Genome map ✓</b>built (step 6) — see the “Model Bank” tab; Sigma.js is the upgrade past a few hundred nodes</div>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="card">
            <h2>Node Inspector</h2>
            <div class="body">
              ${selected ? html`
                <div class="kv"><span>node_type</span><span>${selected.node_type}</span></div>
                <div class="kv"><span>layer</span><span style=${{ color: color(selected.layer) }}>${selected.layer}</span></div>
                <div class="kv"><span>requires_y</span><span>${String(selected.requires_y)}</span></div>
                <div class="kv"><span>is_transformer</span><span>${String(selected.is_transformer)}</span></div>
                <div class="kv"><span>params</span><span>${JSON.stringify(selected.params)}</span></div>
              ` : html`<span class="sub">Click a node in the graph to see its Model-Genome metadata.</span>`}
            </div>
          </div>

          <div class="card">
            <h2>Belief-space stream (auditable, JSON)</h2>
            <div class="body stream">
              ${beliefs.length === 0 ? html`<span class="sub">Press “Run pathway” to stream beliefs as each node fires.</span>` : null}
              ${beliefs.map((b, i) => html`
                <div class="belief" key=${i}>
                  <div class="top">
                    <span class="type" style=${{ color: color((meta[b.source]||{}).layer) }}>${b.type}${b._transformed ? " ⇄" : ""}</span>
                    <span class="conf">conf ${b.confidence.toFixed(3)}</span>
                  </div>
                  <div class="src">#${b._step} · ${b.source} · schema ${b.schema_version}</div>
                  <pre>${JSON.stringify(
                      Object.fromEntries(Object.entries(b.payload).filter(([,v]) => !Array.isArray(v))),
                      null, 1)}</pre>
                </div>`)}
            </div>
          </div>

          <${InterlinguaCard} />
        </div>
      </div>
      `}
    </div>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
